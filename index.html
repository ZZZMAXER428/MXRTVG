<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TV File Manager</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#080b12">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button,
.file,
.menuItem {
    -webkit-user-select: none;
    user-select: none;
}

/* APP */

#app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOP */

.top {
    height: 85px;
    display: flex;
    align-items: center;
    padding: 0 35px;
    background: #10141d;
    border-bottom: 2px solid #202633;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.location {
    margin-left: 35px;
    color: #8f99aa;
    font-size: 18px;
}

/* BODY */

.body {
    flex: 1;
    display: flex;
    min-height: 0;
}

/* SIDEBAR */

.sidebar {
    width: 240px;
    padding: 22px 14px;
    background: #0c1017;
    border-right: 2px solid #202633;
}

.menuItem {
    height: 58px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    margin-bottom: 8px;
    border-radius: 12px;
    color: #aab3c2;
    font-size: 18px;
    outline: none;
}

.menuItem.focused {
    background: #1e6cff;
    color: white;
    transform: scale(1.02);
}

.menuItem.selected {
    background: #182b50;
    color: white;
}

/* CONTENT */

.content {
    flex: 1;
    padding: 28px;
    overflow: hidden;
}

.titleRow {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.title {
    font-size: 29px;
    font-weight: bold;
}

.action {
    background: #171d28;
    color: white;
    border: 0;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 16px;
}

.action.focused {
    background: #1e6cff;
    outline: 3px solid #6f9fff;
}

/* FILE GRID */

.fileGrid {
    height: calc(100% - 70px);
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(5, minmax(150px, 1fr));
    grid-auto-rows: 160px;
    gap: 18px;
    overflow-y: auto;
    padding: 5px;
}

.file {
    background: #121821;
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 20px;
    outline: none;
}

.file.focused {
    border-color: #4d8dff;
    background: #1a2538;
    transform: scale(1.03);
}

.fileIcon {
    font-size: 48px;
    margin-bottom: 14px;
}

.fileName {
    font-size: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.fileSize {
    margin-top: 7px;
    color: #7f8999;
    font-size: 13px;
}

/* EMPTY */

.empty {
    height: calc(100% - 70px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #707b8c;
    font-size: 20px;
}

/* FOOTER */

.footer {
    height: 45px;
    display: flex;
    align-items: center;
    padding-left: 25px;
    background: #10141d;
    color: #707b8c;
    font-size: 13px;
}

/* DIALOG */

.dialog {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.dialog.visible {
    display: flex;
}

.dialogBox {
    width: 520px;
    max-width: 90vw;
    background: #151b25;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 80px black;
}

.dialogBox h2 {
    margin-top: 0;
}

.dialogBox p {
    color: #aab3c2;
    line-height: 1.6;
}

.dialogButton {
    margin-top: 15px;
    background: #1e6cff;
    border: 0;
    color: white;
    padding: 14px 22px;
    border-radius: 10px;
    font-size: 16px;
}

.dialogButton.focused {
    outline: 3px solid #9dbdff;
}

/* SEARCH */

.searchBox {
    display: none;
    position: fixed;
    top: 100px;
    right: 35px;
    width: 420px;
    background: #151b25;
    padding: 20px;
    border-radius: 16px;
    z-index: 50;
}

.searchBox.visible {
    display: block;
}

.searchInput {
    width: 100%;
    background: #0c1017;
    color: white;
    border: 2px solid #303948;
    padding: 15px;
    border-radius: 10px;
    font-size: 18px;
}

/* LARGE TV */

@media (min-width: 1600px) {

    .fileGrid {
        grid-template-columns: repeat(6, minmax(170px, 1fr));
    }

    .file {
        min-height: 170px;
    }

}

</style>
</head>

<body>

<div id="app">

    <div class="top">

        <div class="logo">
            📁 TV File Manager
        </div>

        <div class="location" id="location">
            Home
        </div>

    </div>


    <div class="body">

        <aside class="sidebar">

            <div
                class="menuItem"
                data-menu="home"
            >
                🏠 Home
            </div>

            <div
                class="menuItem"
                data-menu="video"
            >
                🎬 Videos
            </div>

            <div
                class="menuItem"
                data-menu="image"
            >
                🖼 Images
            </div>

            <div
                class="menuItem"
                data-menu="audio"
            >
                🎵 Music
            </div>

            <div
                class="menuItem"
                data-menu="document"
            >
                📄 Documents
            </div>

            <div
                class="menuItem"
                data-menu="other"
            >
                📦 Other
            </div>

        </aside>


        <main class="content">

            <div class="titleRow">

                <div
                    class="title"
                    id="title"
                >
                    Files
                </div>

                <button
                    class="action"
                    id="addButton"
                >
                    ＋ Add Files
                </button>

            </div>


            <div
                class="fileGrid"
                id="fileGrid"
            ></div>


            <div
                class="empty"
                id="empty"
            >
                📁<br><br>
                No files added yet.<br>
                Select "Add Files" to choose files.
            </div>

        </main>

    </div>


    <div class="footer">
        TV File Manager • Designed for D-pad navigation
    </div>

</div>


<input
    type="file"
    id="filePicker"
    multiple
    hidden
>


<div
    class="dialog"
    id="dialog"
>

    <div class="dialogBox">

        <h2 id="dialogTitle">
            File
        </h2>

        <p id="dialogInfo"></p>

        <button
            class="dialogButton"
            id="dialogOpen"
        >
            Open
        </button>

    </div>

</div>


<script>

/* =========================
   DATA
========================= */

let files = [];

let currentCategory = "home";

let focusArea = "sidebar";

let sidebarIndex = 0;

let fileIndex = 0;

let currentFileList = [];


/* =========================
   ELEMENTS
========================= */

const sidebarItems =
    [...document.querySelectorAll(".menuItem")];

const grid =
    document.getElementById("fileGrid");

const empty =
    document.getElementById("empty");

const picker =
    document.getElementById("filePicker");

const addButton =
    document.getElementById("addButton");

const dialog =
    document.getElementById("dialog");

const dialogOpen =
    document.getElementById("dialogOpen");


/* =========================
   FILE CATEGORY
========================= */

function category(file) {

    const type =
        (file.type || "").toLowerCase();

    if (type.startsWith("video/"))
        return "video";

    if (type.startsWith("image/"))
        return "image";

    if (type.startsWith("audio/"))
        return "audio";

    if (
        type.includes("pdf") ||
        type.includes("text") ||
        type.includes("document") ||
        type.includes("word") ||
        type.includes("sheet")
    ) {
        return "document";
    }

    return "other";
}


/* =========================
   ICON
========================= */

function icon(file) {

    const c = category(file);

    if (c === "video")
        return "🎬";

    if (c === "image")
        return "🖼";

    if (c === "audio")
        return "🎵";

    if (c === "document")
        return "📄";

    return "📦";
}


/* =========================
   SIZE
========================= */

function size(bytes) {

    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

    if (bytes < 1024 * 1024 * 1024)
        return (bytes / 1024 / 1024).toFixed(1) + " MB";

    return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   RENDER
========================= */

function render() {

    grid.innerHTML = "";

    if (currentCategory === "home") {

        currentFileList = files;

    } else {

        currentFileList =
            files.filter(
                f => category(f) === currentCategory
            );

    }


    if (currentFileList.length === 0) {

        grid.style.display = "none";

        empty.style.display = "flex";

    } else {

        grid.style.display = "grid";

        empty.style.display = "none";

    }


    currentFileList.forEach((file, index) => {

        const element =
            document.createElement("div");

        element.className = "file";

        element.innerHTML = `
            <div class="fileIcon">
                ${icon(file)}
            </div>

            <div class="fileName">
                ${escapeHTML(file.name)}
            </div>

            <div class="fileSize">
                ${size(file.size)}
            </div>
        `;

        element.onclick = () => {

            fileIndex = index;

            openFile(file);

        };

        grid.appendChild(element);

    });


    updateFocus();

}


/* =========================
   FOCUS
========================= */

function updateFocus() {

    sidebarItems.forEach(
        item => item.classList.remove("focused")
    );

    document
        .querySelectorAll(".file")
        .forEach(
            item => item.classList.remove("focused")
        );

    addButton.classList.remove("focused");


    if (focusArea === "sidebar") {

        if (sidebarItems[sidebarIndex]) {

            sidebarItems[sidebarIndex]
                .classList.add("focused");

            sidebarItems[sidebarIndex]
                .scrollIntoView({
                    block: "nearest"
                });

        }

    }


    if (focusArea === "files") {

        const item =
            document.querySelectorAll(".file")[fileIndex];

        if (item) {

            item.classList.add("focused");

            item.scrollIntoView({
                block: "nearest",
                inline: "nearest"
            });

        }

    }


    if (focusArea === "add") {

        addButton.classList.add("focused");

    }

}


/* =========================
   SELECT CATEGORY
========================= */

function selectSidebar() {

    const item =
        sidebarItems[sidebarIndex];

    if (!item)
        return;

    currentCategory =
        item.dataset.menu;

    const names = {

        home: "Files",
        video: "Videos",
        image: "Images",
        audio: "Music",
        document: "Documents",
        other: "Other"

    };

    document.getElementById("title")
        .textContent = names[currentCategory];

    document.getElementById("location")
        .textContent =
        "Home / " + names[currentCategory];

    fileIndex = 0;

    render();

}


/* =========================
   ADD FILES
========================= */

addButton.onclick = () => {

    picker.click();

};


picker.onchange = () => {

    for (const file of picker.files) {

        files.push(file);

    }

    picker.value = "";

    render();

};


/* =========================
   OPEN FILE
========================= */

function openFile(file) {

    document.getElementById("dialogTitle")
        .textContent = file.name;

    document.getElementById("dialogInfo")
        .innerHTML =
        "Type: " +
        (file.type || "Unknown") +
        "<br><br>" +
        "Size: " +
        size(file.size);

    dialog.classList.add("visible");

    dialogOpen.focus();

    dialogOpen.onclick = () => {

        const url =
            URL.createObjectURL(file);

        window.open(url, "_blank");

    };

}


/* =========================
   DIALOG CLOSE
========================= */

dialog.onclick = event => {

    if (event.target === dialog) {

        dialog.classList.remove("visible");

        focusArea = "files";

        updateFocus();

    }

};


/* =========================
   REMOTE NAVIGATION
========================= */

document.addEventListener(
    "keydown",
    event => {

        const key = event.key;

        if (dialog.classList.contains("visible")) {

            if (
                key === "Backspace" ||
                key === "Escape"
            ) {

                dialog.classList.remove("visible");

                focusArea = "files";

                updateFocus();

            }

            return;

        }


        /* LEFT */

        if (key === "ArrowLeft") {

            if (focusArea === "files") {

                focusArea = "sidebar";

                updateFocus();

                return;

            }

        }


        /* RIGHT */

        if (key === "ArrowRight") {

            if (focusArea === "sidebar") {

                focusArea = "files";

                fileIndex = 0;

                updateFocus();

                return;

            }

        }


        /* UP */

        if (key === "ArrowUp") {

            if (focusArea === "sidebar") {

                sidebarIndex--;

                if (sidebarIndex < 0)
                    sidebarIndex =
                        sidebarItems.length - 1;

            }

            else if (focusArea === "files") {

                fileIndex -= 5;

                if (fileIndex < 0)
                    fileIndex = 0;

            }

            updateFocus();

        }


        /* DOWN */

        if (key === "ArrowDown") {

            if (focusArea === "sidebar") {

                sidebarIndex++;

                if (
                    sidebarIndex >=
                    sidebarItems.length
                ) {

                    sidebarIndex = 0;

                }

            }

            else if (focusArea === "files") {

                fileIndex += 5;

                if (
                    fileIndex >=
                    currentFileList.length
                ) {

                    fileIndex =
                        currentFileList.length - 1;

                }

                if (fileIndex < 0)
                    fileIndex = 0;

            }

            updateFocus();

        }


        /* SELECT */

        if (
            key === "Enter" ||
            key === " " ||
            key === "Select"
        ) {

            if (focusArea === "sidebar") {

                selectSidebar();

            }

            else if (focusArea === "files") {

                if (currentFileList[fileIndex]) {

                    openFile(
                        currentFileList[fileIndex]
                    );

                }

            }

            else if (focusArea === "add") {

                picker.click();

            }

        }

    }
);


/* =========================
   TOUCH SUPPORT
========================= */

sidebarItems.forEach(
    (item, index) => {

        item.addEventListener(
            "click",
            () => {

                sidebarIndex = index;

                focusArea = "sidebar";

                selectSidebar();

            }
        );

    }
);


/* =========================
   START
========================= */

render();

focusArea = "sidebar";

sidebarIndex = 0;

updateFocus();


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("sw.js")
                .catch(
                    error =>
                        console.log(
                            "Service worker error:",
                            error
                        )
                );

        }
    );

}

</script>

</body>
  </html>
